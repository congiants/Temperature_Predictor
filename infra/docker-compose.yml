name: weather-predictor-stack

secrets:
   db_password:
     file: ../secrets/db_password.txt

services:
  db:
    container_name: weather_db
    image: postgis/postgis:18-3.6
    volumes: 
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - ../.env
    restart: unless-stopped
    environment:
        POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-weather_db} -h localhost"]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - 5432:5432
    secrets:
       - db_password

volumes:
    db_data: