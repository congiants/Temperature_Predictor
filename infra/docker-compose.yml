secrets:
   db_password:
     file: ../secrets/db_password.txt

services:
  db:
    container_name: weather_db
    image: postgres:18.0
    volumes: 
      - db_data:/var/lib/postgresql/data
    env_file:
      - ../.env
    restart: unless-stopped
    environment:
        POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -h localhost"]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - 5432:5432
    secrets:
       - db_password

volumes:
    db_data: